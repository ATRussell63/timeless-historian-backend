name: Deploy Release
on:
  push:
    tags:
      - '[0-9]+.[0-9]+*'

jobs:

  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Log in to GHCR
      run: echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    - name: Build image
      run: |
          IMAGE=ghcr.io/${{ vars.OWNER }}/timeless-historian-backend:${{ github.ref_name }}
          docker build -t $IMAGE .

    - name: Push image
      run: |
          IMAGE=ghcr.io/${{ vars.OWNER }}/timeless-historian-backend:${{ github.ref_name }}
          docker push $IMAGE

    - name: Deploy to server
      uses: appleboy/ssh-action@v0.1.8
      with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            IMAGE=ghcr.io/${{ vars.OWNER }}/timeless-historian-backend:${{ github.ref_name }}
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull $IMAGE
            docker stop timeless-historian-backend || true
            docker rm timeless-historian-backend || true
            docker run -d --restart unless-stopped --name timeless-historian-backend -v ${{ secrets.APP_CONFIG }}:/config/config.ini:ro -e APP_CONFIG=/config/config.ini -p 8080:8080 $IMAGE
